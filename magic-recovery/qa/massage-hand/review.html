<!doctype html><meta charset="utf-8"><title>Bound massage hand review</title><style>body{margin:0;background:#10191e;color:#cbd7dd;font:13px system-ui}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px}article{background:#19262d;border:1px solid #394b55;border-radius:12px;overflow:hidden}h3{font-size:13px;font-weight:500;margin:10px 14px}canvas{display:block;width:100%;height:260px}</style><main id="grid"></main><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {buildMassageHand,createCalfSurface,createMassagePlayback} from '/src/BoundMassageHand.js';
import {muscles} from '/src/data.js';
const [asset,meta,buffer]=await Promise.all([fetch('/models/massage-hand.json').then(r=>r.json()),fetch('/models/legs.json').then(r=>r.json()),fetch('/models/legs.bin').then(r=>r.arrayBuffer())]);
const params=new URLSearchParams(location.search),phase=+(params.get('phase')||3.75),side=params.get('side')||'right';
for(const technique of ['knead','thumb'])for(const view of ['back','side','oblique']){
 const article=document.createElement('article');article.innerHTML=`<h3>${side} · ${technique} · ${view} · ${phase}s</h3>`;grid.append(article);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(article.clientWidth,260);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0x19262d);article.append(renderer.domElement);
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x43525a,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-1,2,-2);scene.add(light);
 const region=muscles.find(r=>r.id==='calves');const meshes=meta.parts.filter(p=>region.match.test(p.name)&&p.name.toLowerCase().includes(side)).map(p=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(buffer,p.positions,p.vertexCount*3).slice(),3));g.setIndex(new THREE.BufferAttribute(new Uint32Array(buffer,p.indices,p.indexCount).slice(),1));g.computeVertexNormals();const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xdc915c,roughness:.72,side:THREE.DoubleSide}));scene.add(m);m.updateMatrixWorld();return m;});
 const point=new THREE.Vector3(Math.abs(region.point[0])*(side==='right'?-1:1),region.point[1],region.point[2]),normal=new THREE.Vector3(0,0,-1);const ray=new THREE.Raycaster(point.clone().addScaledVector(normal,.6),normal.clone().negate());point.copy(ray.intersectObjects(meshes)[0].point);
 const surface=createCalfSurface(meshes,{point,normal},side),rig=buildMassageHand(asset);const playback=createMassagePlayback(rig,surface,technique);playback.update(phase);const group=new THREE.Group();group.matrixAutoUpdate=false;group.matrix.copy(surface.matrix);group.add(playback.mesh);scene.add(group);
 const camera=new THREE.PerspectiveCamera(32,article.clientWidth/260,.001,5),target=surface.center.clone();
 const direction={back:new THREE.Vector3(0,.1,-1),side:new THREE.Vector3(side==='right'?1:-1,.05,-.1),oblique:new THREE.Vector3(side==='right'?-1:1,.65,-1.4)}[view];camera.position.copy(target).addScaledVector(direction.normalize(),.44);camera.lookAt(target);renderer.render(scene,camera);
}
</script>
