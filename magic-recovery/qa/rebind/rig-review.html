<!doctype html><html lang="zh"><meta charset="utf-8"><title>Atlas 重新绑定 · 动画检查</title><style>body{margin:0;background:#172026;color:#e4edef;font:15px system-ui}header{display:flex;gap:8px;flex-wrap:wrap;padding:10px;align-items:center}button,select{background:#34444f;color:white;border:1px solid #63717b;border-radius:8px;padding:9px}canvas{display:block}input{accent-color:#e69d67}span{color:#b0c2ca}</style><header><strong>Atlas · 51 骨骼 / 30 手指关节</strong><select id="clip"></select><button id="play">暂停</button><label><input type="checkbox" id="rig">显示骨架</label><button id="side">侧面</button><button id="angle">斜上方</button><button id="front">正面</button><input id="time" type="range" min="0" max="6" step=".02" value="0"><span id="stamp">0 s</span></header><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {OrbitControls} from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import {createBoundAtlasRig} from '/src/BoundAtlasRig.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#172026');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight-124);document.body.append(renderer.domElement);renderer.outputColorSpace=THREE.SRGBColorSpace;
const camera=new THREE.PerspectiveCamera(36,innerWidth/(innerHeight-124),.01,30),controls=new OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xe3f4ff,0x526777,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,4,3);scene.add(light);
const grid=new THREE.GridHelper(3,20,0x738694,0x344550);grid.position.y=.01;scene.add(grid);
const floor=new THREE.Mesh(new THREE.BoxGeometry(.8,.07,2),new THREE.MeshStandardMaterial({color:0x303c45}));floor.position.set(0,.015,0);scene.add(floor);
const el=id=>document.getElementById(id);for(const side of ['right','left'])for(const name of ['supine','quads','hamstrings','adductors','calves','shins'])el('clip').add(new Option(name+' · '+side,name+'-'+side));
let model,helper,playing=true,time=0,close=false,currentView="angle",last=performance.now();
function view(kind){currentView=kind;const supine=el('clip').value.startsWith('supine');const target=new THREE.Vector3(0,supine?.37:.87,supine?-.12:.15);if(close&&supine)target.set(el('clip').value.endsWith('left')?.09:-.09,.445,-.18);controls.target.copy(target);const views={side:[1,.12,0],opposite:[-1,.12,0],front:[0,.55,1],head:[0,.8,-1],top:[0,1,.001],angle:[1,1.6,.7]};const v=new THREE.Vector3(...(views[kind]||views.angle));camera.position.copy(target).addScaledVector(v.normalize(),supine?(close?.85:2.1):3.0);controls.update();}
async function change(){if(model){scene.remove(model.root);model.dispose();}if(helper)scene.remove(helper);const [region,side]=el('clip').value.split('-');model=await createBoundAtlasRig(scene,region==='supine'?'hamstrings':region,side,()=>false,()=>({supine:region==='supine'}));helper=new THREE.SkeletonHelper(model.root);helper.material.depthTest=false;helper.renderOrder=10;helper.visible=el('rig').checked;scene.add(helper);time=0;floor.visible=region==='supine';view('angle');}
el('clip').onchange=change;el('rig').onchange=()=>helper.visible=el('rig').checked;el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暂停':'播放';};el('time').oninput=e=>{playing=false;time=+e.target.value;el('play').textContent='播放';};for(const k of ['side','angle','front'])el(k).onclick=()=>view(k);await change();
for(const [kind,label] of [['opposite','另一侧'],['head','头侧'],['top','俯视']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>view(kind);document.querySelector('header').append(b);}
for(const phase of [0,1.5,3,4.5]){const b=document.createElement('button');b.textContent=phase+'s';b.onclick=()=>{playing=false;time=phase;el('play').textContent='播放';};document.querySelector('header').append(b);}
const zoom=document.createElement('button');zoom.textContent='近看托手';zoom.onclick=()=>{close=!close;zoom.textContent=close?'查看全身':'近看托手';view(currentView);};document.querySelector('header').append(zoom);
renderer.setAnimationLoop(()=>{const now=performance.now();if(playing)time=(time+(now-last)/1000)%6;last=now;model?.update(time);el('time').value=time;el('stamp').textContent=time.toFixed(2)+' s';renderer.render(scene,camera);});
</script></html>
